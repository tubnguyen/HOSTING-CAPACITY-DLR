name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts data

      - name: Test
        run: pytest -q

      # Deliberately runs the CLI into the same runs/ directory the matrix
      # uses, and in that order. That is what the README's quickstart does, and
      # a directory named by the CLI is not a preset name.
      - name: Smoke run
        run: |
          corridor-sim --preset dlr2_der4_bess --start 2024-06-01 --days 1 --out runs
          python scripts/run_matrix.py --only static_der4 dlr2_der4 --days 1 --jobs 2

      - name: Dataset is reproducible from its seed
        run: |
          python data/generate.py --year 2024 --seed 20240101 --out /tmp/regen
          for f in weather load pv_generation reserve_activation; do
            cmp "data/$f.csv" "/tmp/regen/$f.csv"
          done
